name: Android APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Typecheck and tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          EXPO_OFFLINE: 1

      - name: Build release APK (arm64 + armv7)
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        id: apk
        run: |
          V=$(node -p "require('./app.json').expo.version")
          OUT="super-note-${V}-beta.${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "../$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      - name: Publish beta release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}-beta.${{ github.run_number }}"
          cp "${{ steps.apk.outputs.file }}" super-note-beta.apk
          gh release create "$TAG" "${{ steps.apk.outputs.file }}" super-note-beta.apk \
            --title "Super Note ${{ steps.apk.outputs.version }} beta ${{ github.run_number }}" \
            --notes "Beta build for testing. Install on Android 8 or newer. Allow 'install unknown apps' when asked." \
            --latest
